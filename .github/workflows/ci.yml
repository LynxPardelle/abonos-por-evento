name: Verificar SaldoEvento

on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix services ci
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run package:frontend
      - run: npm run smoke:frontend
      - run: npm run validate:infra
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cfn-lint==1.60.1
      - run: cfn-lint infra/template.yaml infra/artifacts.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: saldoevento-frontend-${{ github.sha }}
          path: artifacts/frontend
          retention-days: 14
